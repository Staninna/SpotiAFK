[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotiafk"
version = "2.0.0"
description = "Plays a Spotify playlist on your devices while you're away"
requires-python = ">=3.11"
dependencies = ["spotipy~=2.24", "telegram-send"]

[project.scripts]
spotiafk = "spotiafk.cli:main"

[tool.setuptools]
packages = ["spotiafk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplifications
]

[tool.ruff.lint.isort]
known-first-party = ["spotiafk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
