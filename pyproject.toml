[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplifications
]

[tool.ruff.lint.isort]
# options.py is gitignored (user credentials), so tell ruff it's first-party
# even when the file is absent, keeping import order identical locally and in CI.
known-first-party = ["options", "spotiafk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
